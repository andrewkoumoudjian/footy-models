[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/entities",
    "crates/temporal",
    "crates/source-fm",
    "crates/source-transfermarkt",
    "crates/source-fbref",
    "crates/source-salary",
    "crates/performance",
    "crates/models",
    "crates/state",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
footy-core = { path = "crates/core" }
footy-entities = { path = "crates/entities" }
footy-temporal = { path = "crates/temporal" }
footy-source-fm = { path = "crates/source-fm" }
footy-source-transfermarkt = { path = "crates/source-transfermarkt" }
footy-source-fbref = { path = "crates/source-fbref" }
footy-source-salary = { path = "crates/source-salary" }
footy-performance = { path = "crates/performance" }
footy-models = { path = "crates/models" }
footy-state = { path = "crates/state" }
