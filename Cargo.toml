[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/entities",
    "crates/temporal",
    "crates/source-fm",
    "crates/source-transfermarkt",
    "crates/source-fbref",
    "crates/source-salary",
    "crates/source-stats",
    "crates/performance",
    "crates/models",
    "crates/state",
    "crates/market",
    "crates/forecast",
    "crates/match",
    "crates/recruitment",
    "crates/backtest",
    "crates/artifacts",
    "crates/dataset",
    "apps/ingest",
    "apps/train",
    "apps/score",
    "apps/query",
    "apps/mc",
    "apps/forward",
    "apps/matchforecast",
    "apps/plforecast",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
footy-core = { path = "crates/core" }
footy-entities = { path = "crates/entities" }
footy-temporal = { path = "crates/temporal" }
footy-source-fm = { path = "crates/source-fm" }
footy-source-transfermarkt = { path = "crates/source-transfermarkt" }
footy-source-fbref = { path = "crates/source-fbref" }
footy-source-salary = { path = "crates/source-salary" }
footy-source-stats = { path = "crates/source-stats" }
footy-performance = { path = "crates/performance" }
footy-models = { path = "crates/models" }
footy-state = { path = "crates/state" }
footy-market = { path = "crates/market" }
footy-forecast = { path = "crates/forecast" }
footy-match = { path = "crates/match" }
footy-recruitment = { path = "crates/recruitment" }
footy-backtest = { path = "crates/backtest" }
footy-artifacts = { path = "crates/artifacts" }
footy-dataset = { path = "crates/dataset" }
serde_json = "1.0"
