name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Test workspace
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.75.0 test --workspace --all-targets
      - name: End-to-end canonical pipeline
        env:
          RUSTFLAGS: -D warnings
        run: bash scripts/e2e-smoke.sh

  premier-league-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed Monte Carlo snapshot
        run: python3 scripts/validate_pl_snapshot.py
      - name: Install plotting/test dependencies
        run: python3 -m pip install --quiet plotly Pillow
      - name: Timeline chart and pipeline guards
        run: python3 tests/test_pl_timeline.py
      - name: Forecast target and calibration release gates
        run: |
          python3 tests/test_forecast_targets.py
          python3 scripts/check_forecast_release.py --output /tmp/forecast-release-gates.json
