[package]
name = "footy-candle-mls-shots"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately isolated: the production workspace stays at its pinned Rust 1.75 toolchain.
[workspace]

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
