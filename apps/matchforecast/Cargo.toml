[package]
name = "footy-matchforecast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "footy_matchforecast"
path = "src/lib.rs"

[[bin]]
name = "footy-matchforecast"
path = "src/main.rs"

[[bin]]
name = "footy-matchforecast-mls"
path = "src/main_mls.rs"

[[bin]]
name = "footy-matchforecast-pl"
path = "src/main_pl.rs"

[[bin]]
name = "footy-matchforecast-backtest"
path = "src/backtest.rs"

[[bin]]
name = "footy-matchforecast-pl-hist"
path = "src/main_pl_hist.rs"

[[bin]]
name = "footy-matchforecast-math"
path = "src/math_engine_main.rs"

[[bin]]
name = "footy-participation-eval"
path = "src/main_participation_eval.rs"

[[bin]]
name = "footy-shot-rate-eval"
path = "src/main_shot_rate_eval.rs"

[[bin]]
name = "footy-team-goals-oos"
path = "src/main_team_goals_oos.rs"

[dependencies]
footy-core = { path = "../../crates/core" }
footy-source-stats = { path = "../../crates/source-stats" }
footy-dataset = { path = "../../crates/dataset" }
footy-performance = { path = "../../crates/performance" }
footy-forecast = { path = "../../crates/forecast" }
footy-state = { path = "../../crates/state" }
footy-entities = { path = "../../crates/entities" }
footy-match = { path = "../../crates/match" }
serde_json = { workspace = true }
